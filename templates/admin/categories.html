{% extends "admin/base.html" %}
{% block title %}分类管理{% endblock %}
{% block content %}
<div class="admin-header">
  <div>
    <h1>分类管理</h1>
    <p>自定义分类；工具的归类请在「工具管理」中设置</p>
  </div>
  <div class="admin-actions">
    <span class="admin-badge">{{ categories|length }} 个分类</span>
    <form method="post" action="{{ url_path('/admin/categories/reset') }}" class="inline" onsubmit="return confirm('确定恢复为默认分类吗？工具的归类分配也会重置。');">
      <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}" />
      <button type="submit" class="admin-btn admin-btn-danger">恢复默认</button>
    </form>
  </div>
</div>

{% if flash %}
<div class="admin-flash ok" role="status">{{ flash }}</div>
{% endif %}

<!-- ===== Form A: categories ===== -->
<form method="post" action="{{ url_path('/admin/categories') }}" id="catForm">
  <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}" />
  <div class="admin-panel">
    <div class="admin-panel-h">
      <span>分类列表</span>
      <span class="admin-muted" style="font-weight:600;font-size:12px">拖动上移/下移调整顺序</span>
    </div>
    <div class="admin-cats">
      {% for cat in categories %}
      <div class="admin-cat-row">
        <input type="hidden" name="cat_id" value="{{ cat.id }}" />
        <span class="admin-cat-grip" aria-hidden="true">⠿</span>
        <div class="admin-field">
          <label>图标</label>
          <input type="text" name="cat_icon" value="{{ cat.icon }}" maxlength="4" class="admin-cat-icon" />
        </div>
        <div class="admin-field admin-cat-name">
          <label>名称</label>
          <input type="text" name="cat_name" value="{{ cat.name }}" required />
        </div>
        <div class="admin-field admin-cat-accent">
          <label>主题色</label>
          <select name="cat_accent">
            {% for a in accent_choices %}
            <option value="{{ a }}" {% if cat.accent == a %}selected{% endif %}>{{ a }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="admin-field admin-cat-desc">
          <label>描述</label>
          <input type="text" name="cat_desc" value="{{ cat.description }}" />
        </div>
        <div class="admin-cat-ops">
          <button type="button" class="admin-btn admin-cat-move" data-dir="-1" title="上移">↑</button>
          <button type="button" class="admin-btn admin-cat-move" data-dir="1" title="下移">↓</button>
        </div>
        <label class="admin-cat-remove">
          <input type="checkbox" name="cat_remove" value="{{ cat.id }}" class="admin-cat-remove-input" />
          <span class="admin-badge">删除</span>
        </label>
      </div>
      {% endfor %}
    </div>
    <div class="admin-panel-b">
      <button type="button" class="admin-btn" id="catAddBtn">＋ 添加分类</button>
      <button type="submit" class="admin-btn admin-btn-primary" style="float:right">保存分类</button>
    </div>
  </div>
</form>

<template id="catRowTemplate">
  <div class="admin-cat-row">
    <input type="hidden" name="cat_id" value="" />
    <span class="admin-cat-grip" aria-hidden="true">⠿</span>
    <div class="admin-field">
      <label>图标</label>
      <input type="text" name="cat_icon" value="🧩" maxlength="4" class="admin-cat-icon" />
    </div>
    <div class="admin-field admin-cat-name">
      <label>名称</label>
      <input type="text" name="cat_name" value="" required />
    </div>
    <div class="admin-field admin-cat-accent">
      <label>主题色</label>
      <select name="cat_accent">
        {% for a in accent_choices %}
        <option value="{{ a }}">{{ a }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="admin-field admin-cat-desc">
      <label>描述</label>
      <input type="text" name="cat_desc" value="" />
    </div>
    <div class="admin-cat-ops">
      <button type="button" class="admin-btn admin-cat-move" data-dir="-1" title="上移">↑</button>
      <button type="button" class="admin-btn admin-cat-move" data-dir="1" title="下移">↓</button>
    </div>
    <label class="admin-cat-remove">
      <input type="checkbox" name="cat_remove" value="" class="admin-cat-remove-input" />
      <span class="admin-badge">删除</span>
    </label>
  </div>
</template>

<script>
(function () {
  // ---- Category reorder (up/down) ----
  var list = document.querySelector('.admin-cats');
  function swap(row, dir) {
    var rows = Array.prototype.slice.call(list.children);
    var i = rows.indexOf(row);
    var j = i + dir;
    if (i < 0 || j < 0 || j >= rows.length) return;
    list.insertBefore(rows[i], j < i ? rows[j] : rows[j].nextSibling);
  }
  list.addEventListener('click', function (e) {
    var btn = e.target.closest('.admin-cat-move');
    if (!btn) return;
    var row = btn.closest('.admin-cat-row');
    swap(row, parseInt(btn.getAttribute('data-dir'), 10) || 0);
  });

  // ---- Add category (clone template) ----
  var addBtn = document.getElementById('catAddBtn');
  var tpl = document.getElementById('catRowTemplate');
  if (addBtn && tpl) {
    addBtn.addEventListener('click', function () {
      var node = tpl.content.cloneNode(true);
      var row = node.querySelector('.admin-cat-row');
      var cid = 'custom' + Date.now().toString(36);
      row.querySelector('input[name="cat_id"]').value = cid;
      row.querySelector('input[name="cat_name"]').value = '';
      list.appendChild(node);
      row.querySelector('input[name="cat_name"]').focus();
    });
  }

  // ---- Mark rows selected for deletion ----
  function bindRemove() {
    document.querySelectorAll('.admin-cat-remove-input').forEach(function (chk) {
      if (chk._bound) return;
      chk._bound = true;
      chk.addEventListener('change', function () {
        var row = chk.closest('.admin-cat-row');
        if (row) row.classList.toggle('is-off', chk.checked);
      });
    });
  }
  bindRemove();
  // Re-bind for rows added later.
  var mo = new MutationObserver(bindRemove);
  if (list) mo.observe(list, { childList: true });
})();
</script>
{% endblock %}
