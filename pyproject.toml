[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["static", "file", "media", "deploy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length handled by formatter / intentional long URLs
    "B008",   # FastAPI uses function calls in defaults (File/Form/Query)
    "B904",   # raise ... from exceptions are handled explicitly where needed
    "SIM108", # keep explicit if/else where readability matters
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
